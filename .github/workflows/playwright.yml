# .github/workflows/playwright.yml
#
# This GitHub Actions workflow runs your Playwright tests automatically
# whenever you push code or open a pull request.
#
# This is continuous integration (CI) — a standard practice that ensures
# tests pass before code is merged. Having CI in your portfolio shows
# employers you understand real-world QA workflows.

name: Playwright Tests

on:
  # Run on every push to any branch
  push:
    branches: ['**']
  # Also run when a pull request is opened or updated
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install project dependencies (Playwright itself)
      - name: Install dependencies
        run: npm ci

      # Step 4: Install the browser binaries Playwright needs
      # This downloads Chromium and Firefox so the tests can run headlessly
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Step 5: Run the tests
      - name: Run Playwright tests
        run: npx playwright test

      # Step 6: Upload the HTML test report so you can view results in GitHub
      # This runs even if tests fail, so you can always see what went wrong
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
